<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Absen SRT2 - Demo Offline</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f4f6fb;color:#1e2a45;display:flex;min-height:100vh}
a{text-decoration:none;color:inherit}
[hidden]{display:none!important}
.sidebar{width:260px;background:linear-gradient(180deg,#1d5fd6,#1546a8);color:#fff;padding:22px 16px;position:fixed;top:0;bottom:0;overflow-y:auto;z-index:60}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:26px;padding:0 6px}
.brand-logo{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:21px}
.brand h2{font-size:20px}.brand small{font-size:11px;opacity:.85}
.mt{font-size:11px;letter-spacing:1.5px;font-weight:700;text-transform:uppercase;margin:18px 10px 8px;opacity:.8}
.mi{display:flex;gap:12px;padding:11px 14px;border-radius:12px;font-size:15px;margin-bottom:3px;transition:.2s}
.mi:hover{background:rgba(255,255,255,.12)}
.mi.on{background:#fff;color:#1d5fd6;font-weight:700}
.user-box{background:rgba(255,255,255,.15);border-radius:14px;padding:12px;margin-top:28px}
.lbl-w{font-size:11px;opacity:.85;display:block;margin-bottom:6px}
.user-box select{width:100%}
.btn-reset{margin-top:10px;width:100%;background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:10px;padding:8px;cursor:pointer;font-size:12px}
.main{margin-left:260px;flex:1;min-width:0}
.topbar{background:#fff;padding:16px 28px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #e8ecf4}
.topbar h3{font-size:18px}.topbar small{color:#6b7794;font-size:12px}
.burger{display:none;background:#f0f3fa;border:none;border-radius:10px;width:42px;height:42px;font-size:20px;cursor:pointer}
.content{padding:26px 28px}
.hero{background:linear-gradient(135deg,#1d5fd6,#3377e0);color:#fff;border-radius:20px;padding:28px;margin-bottom:20px}
.hero h1{font-size:25px;margin-bottom:6px}.hero p{font-size:14px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 2px 10px rgba(30,42,69,.04);margin-bottom:18px}
.cards .card{margin-bottom:0}
.stat-num{font-size:30px;font-weight:800}.stat-label{color:#6b7794;font-size:13px}
.g{color:#1f9b4d}.b{color:#2563eb}.r{color:#e04646}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.card-head h4{font-size:16px}
.muted{color:#6b7794;font-size:13px}
input,select,textarea{border:1px solid #e3e8f2;border-radius:10px;padding:9px 12px;font-size:14px;font-family:inherit;background:#fff}
textarea{width:100%;resize:vertical}
.btn{background:#1d5fd6;color:#fff;border:none;border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:600}
.btn.block{width:100%;padding:13px;margin-top:12px}
.btn-light{background:#eef3ff;color:#1d5fd6;border:none;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px}
.btn-del{background:#ffe9e9;color:#e04646;border:none;border-radius:8px;padding:6px 12px;cursor:pointer}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.tab{flex-shrink:0;padding:9px 16px;border-radius:30px;background:#fff;border:1.5px solid #e3e8f2;font-weight:600;font-size:14px;color:#6b7794;cursor:pointer}
.tab.on{background:#1d5fd6;border-color:#1d5fd6;color:#fff}
.grp{font-weight:700;font-size:14px;padding:8px 14px;border-radius:10px;margin:14px 0 6px}
.grp.L{background:#e3edff;color:#1d5fd6}.grp.P{background:#ffe6f1;color:#d6277a}
.row{display:grid;grid-template-columns:minmax(150px,1.2fr) auto minmax(140px,1fr);gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #f0f3fa}
.nm{display:flex;align-items:center;font-weight:600;font-size:14px;gap:10px}
.av{width:36px;height:36px;border-radius:10px;background:#eef3ff;color:#1d5fd6;display:grid;place-items:center;font-weight:700;flex-shrink:0}
.opts{display:flex;gap:6px}
.opt input{display:none}
.opt span{display:block;padding:7px 13px;border-radius:20px;border:1.5px solid #e3e8f2;font-size:13px;font-weight:600;color:#6b7794;cursor:pointer;user-select:none}
.opt.hadir input:checked+span,.opt.bersih input:checked+span{background:#1f9b4d;border-color:#1f9b4d;color:#fff}
.opt.sakit input:checked+span{background:#e8832a;border-color:#e8832a;color:#fff}
.opt.izin input:checked+span{background:#2563eb;border-color:#2563eb;color:#fff}
.opt.alpa input:checked+span,.opt.kotor input:checked+span{background:#e04646;border-color:#e04646;color:#fff}
.ket{width:100%;font-size:13px;visibility:hidden}
.row.need .ket{visibility:visible}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.pc{background:#f0f3fa;color:#4b5876;padding:5px 12px;border-radius:20px;font-size:12px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:10px;border-bottom:1px solid #f0f3fa}
.tbl th{color:#6b7794;font-size:12px;text-transform:uppercase}
.sh{display:inline-block;width:28px;height:28px;line-height:28px;text-align:center;border-radius:8px;font-size:12px;font-weight:700;background:#f0f3fa;color:#9aa6c0}
.sh.hadir{background:#e6f7ec;color:#1f9b4d}.sh.sakit{background:#ffe9d1;color:#e8832a}.sh.izin{background:#dfe8ff;color:#2563eb}.sh.alpa{background:#ffe9e9;color:#e04646}
.table-scroll{overflow-x:auto}
.chart{display:flex;align-items:flex-end;gap:14px;height:200px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:#6b7794}
.bar i{display:block;width:100%;max-width:46px;background:linear-gradient(#3b6cf5,#7aa0ff);border-radius:8px 8px 0 0;margin-bottom:6px}
.item{padding:12px 0;border-bottom:1px solid #f0f3fa;display:flex;gap:12px;align-items:flex-start}
.item:last-child{border:none}.item .gr{flex:1}.item small{color:#8793ad;font-size:11px;display:block}
.item p{font-size:14px;line-height:1.5;margin-top:4px}
.form{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#16213e;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;z-index:99}
.overlay{display:none}
@media(max-width:800px){
  .sidebar{transform:translateX(-100%);transition:transform .25s}
  body.nav .sidebar{transform:none}
  body.nav .overlay{display:block;position:fixed;inset:0;background:rgba(10,20,50,.5);z-index:55}
  .main{margin-left:0}.burger{display:grid;place-items:center}
  .content{padding:16px}.topbar{padding:12px 16px}.topbar small{display:none}
  .cards{grid-template-columns:1fr}
  .row{grid-template-columns:1fr;gap:8px}
  .opts{width:100%}.opt{flex:1}.opt span{text-align:center;padding:10px 4px}
}

</style>
</head>
<body>
<div class="overlay" id="ovl"></div>
<aside class="sidebar">
  <div class="brand"><div class="brand-logo">📘</div><div><h2>Absen SRT2</h2><small>Demo Sistem Absensi Asrama</small></div></div>
  <nav id="menu"></nav>
  <div class="user-box">
    <label class="lbl-w">Peran demo</label>
    <select id="peran"><option value="admin">Admin</option><option value="wali">Wali Asrama</option></select>
    <button class="btn-reset" id="reset">↺ Reset data demo</button>
  </div>
</aside>
<main class="main">
  <header class="topbar">
    <button class="burger" id="burger" aria-label="Menu">☰</button>
    <div><h3 id="sapa"></h3><small>Mode demo: data disimpan di browser kamu, tanpa server.</small></div>
  </header>
  <section class="content" id="isi"></section>
</main>
<div id="toast" class="toast" hidden></div>
<script>
// Absen SRT2 - versi demo offline. Semua data disimpan di localStorage (tanpa server / database).
(function () {
  'use strict';
  const KEY = 'srt2-demo-v1';
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = n => String(n).padStart(2, '0');
  const fmt = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const hariIni = () => fmt(new Date());
  const geser = (s, n) => { const [y, m, d] = s.split('-').map(Number); return fmt(new Date(y, m - 1, d + n)); };
  const tglIndo = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }); };

  const AGAMA = { islam: 'Islam', kristen: 'Kristen', katolik: 'Katolik', hindu: 'Hindu', buddha: 'Buddha' };
  const JENIS = {
    sekolah: { label: '🏫 Sekolah', agama: null },
    subuh: { label: '🕌 Subuh', agama: ['islam'] }, dzuhur: { label: 'Dzuhur', agama: ['islam'] },
    ashar: { label: 'Ashar', agama: ['islam'] }, maghrib: { label: 'Maghrib', agama: ['islam'] }, isya: { label: 'Isya', agama: ['islam'] },
    ibadah_subuh: { label: '✝️ Ibadah Subuh', agama: ['kristen', 'katolik'] },
    ibadah_siang: { label: 'Ibadah Siang', agama: ['kristen', 'katolik'] },
    ibadah_malam: { label: 'Ibadah Malam', agama: ['kristen', 'katolik'] }
  };
  const OPSI = { hadir: 'Hadir', sakit: 'Sakit', izin: 'Izin', alpa: 'Alpa' };
  const GJ = { L: '👦 Laki-laki', P: '👧 Perempuan' };

  // ---------- data awal (dummy) ----------
  function seed() {
    const nama = [['Ahmad Fauzi', 'L', 'islam'], ['Budi Gunawan', 'L', 'islam'], ['Rendi Saputra', 'L', 'islam'], ['Yohanes Lukas', 'L', 'kristen'], ['Markus Tandi', 'L', 'katolik'], ['Dimas Pratama', 'L', 'islam'],
      ['Siti Aminah', 'P', 'islam'], ['Dewi Lestari', 'P', 'islam'], ['Putri Ayu', 'P', 'islam'], ['Maria Natalia', 'P', 'katolik'], ['Debora Sari', 'P', 'kristen'], ['Nur Aisyah', 'P', 'islam']];
    const db = { siswa: nama.map((n, i) => ({ id: i + 1, nama: n[0], jk: n[1], agama: n[2] })), absensi: {}, kamar: [], kebersihan: {}, laporan: [], pengumuman: [], seq: 100 };
    ['Kamar 1', 'Kamar 2', 'Al-Fatih'].forEach((n, i) => db.kamar.push({ id: i + 1, nama: n, jk: 'L' }));
    ['Melati', 'Mawar', 'Anggrek'].forEach((n, i) => db.kamar.push({ id: i + 4, nama: n, jk: 'P' }));
    const h = hariIni();
    for (let k = 1; k <= 6; k++) {   // riwayat 6 hari ke belakang untuk grafik
      const t = geser(h, -k), o = {};
      db.siswa.forEach((s, i) => { const x = (i * 7 + k * 3) % 11; o[s.id] = { status: x === 0 ? 'alpa' : x === 1 ? 'sakit' : x === 2 ? 'izin' : 'hadir', ket: x < 3 ? (x === 1 ? 'Demam' : x === 2 ? 'Acara keluarga' : 'Tanpa kabar') : '' }; });
      db.absensi['sekolah|' + t] = o;
    }
    db.laporan.push({ id: 1, siswaId: 2, tgl: geser(h, -3), teks: 'Sering menyendiri saat jam makan malam dan menolak diajak ke aula.', perk: 'awal', pelapor: 'Wali Asrama' });
    db.pengumuman.push({ id: 1, judul: 'Selamat datang di demo Absen SRT2', isi: 'Ini data contoh. Coba isi absensi, nilai kebersihan kamar, atau buat laporan.', waktu: new Date().toISOString(), pembuat: 'Admin' });
    return db;
  }
  let db;
  try { db = JSON.parse(localStorage.getItem(KEY)) || seed(); } catch (e) { db = seed(); }
  const simpan = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} };
  simpan();

  let peran = 'admin', halaman = 'dashboard';
  const S = { jenis: 'sekolah', tgl: hariIni(), kb: 'L', tampil: 'sekolah' };
  const admin = () => peran === 'admin';
  function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 2200); }
  const ava = s => '<span class="av">' + esc(s.nama.charAt(0)) + '</span>';
  const id = () => ++db.seq;

  // ---------- menu ----------
  const MENU = [['Dashboard', null, true], ['dashboard', '▦ Dashboard', true], ['Presensi'], ['absen', '✅ Absensi Harian'], ['rekap', '📊 Rekap Absensi', true],
    ['kebersihan', '🧹 Kebersihan Kamar'], ['Laporan'], ['laporan', '📝 Kebutuhan Khusus'], ['Administrasi'], ['pengumuman', '📢 Pengumuman']];
  function menu() {
    $('menu').innerHTML = MENU.map(m => {
      if (m[1] === undefined || m[1] === null) return (m[2] && !admin()) ? '' : '<div class="mt">' + m[0] + '</div>';
      if (m[2] && !admin()) return '';
      return '<a class="mi ' + (m[0] === halaman ? 'on' : '') + '" href="#' + m[0] + '">' + m[1] + '</a>';
    }).join('');
  }

  // ---------- halaman ----------
  const stat = (jenis, tgl) => {
    const d = db.absensi[jenis + '|' + tgl] || {}, c = { hadir: 0, sakit: 0, izin: 0, alpa: 0 };
    Object.values(d).forEach(r => { c[r.status]++; });
    return c;
  };

  function pDashboard() {
    const h = hariIni(), c = stat('sekolah', h), tot = db.siswa.length, tercatat = c.hadir + c.sakit + c.izin + c.alpa;
    const alpa = c.alpa + Math.max(0, tot - tercatat);
    const hari = []; for (let k = 5; k >= 0; k--) hari.push(geser(h, -k));
    const nil = hari.map(t => stat('sekolah', t).hadir), mx = Math.max(1, ...nil);
    const nm = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
    return `<div class="hero"><h1>Halo, ${admin() ? 'Admin' : 'Wali Asrama'}!</h1><p>Hari ini ${c.hadir} siswa hadir, ${c.sakit + c.izin} izin/sakit, dan ${alpa} alpa (yang belum diabsen dihitung alpa).</p></div>
    <div class="cards">
      <div class="card"><div class="stat-num g">${c.hadir}</div><div class="stat-label">Hadir dari ${tot} siswa</div></div>
      <div class="card"><div class="stat-num b">${c.sakit + c.izin}</div><div class="stat-label">Izin &amp; Sakit</div></div>
      <div class="card"><div class="stat-num r">${alpa}</div><div class="stat-label">Alpa</div></div>
    </div>
    <div class="card"><div class="card-head"><h4>📊 Kehadiran 6 Hari Terakhir</h4></div>
      <div class="chart">${hari.map((t, i) => `<div class="bar"><b>${nil[i]}</b><i style="height:${Math.round(nil[i] / mx * 150)}px"></i>${nm[new Date(t + 'T00:00').getDay()]}</div>`).join('')}</div></div>`;
  }

  function dipakai() { const b = JENIS[S.jenis].agama; return db.siswa.filter(s => !b || b.includes(s.agama)); }

  function pAbsen() {
    const data = db.absensi[S.jenis + '|' + S.tgl] || {}, list = dipakai();
    const tabs = Object.entries(JENIS).map(([k, v]) => `<a class="tab ${k === S.jenis ? 'on' : ''}" data-j="${k}">${v.label}</a>`).join('');
    const grup = g => {
      const l = list.filter(s => s.jk === g); if (!l.length) return '';
      return `<div class="grp ${g}">${GJ[g]} (${l.length})</div>` + l.map(s => {
        const r = data[s.id] || {}, cur = r.status || '';
        return `<div class="row ${cur && cur !== 'hadir' ? 'need' : ''}" data-id="${s.id}">
          <div class="nm">${ava(s)}<span>${esc(s.nama)}${!JENIS[S.jenis].agama ? ` <small class="muted">• ${AGAMA[s.agama]}</small>` : ''}</span></div>
          <div class="opts">${Object.entries(OPSI).map(([v, lb]) => `<label class="opt ${v}"><input type="radio" name="st${s.id}" value="${v}" ${cur === v ? 'checked' : ''}><span>${lb}</span></label>`).join('')}</div>
          <input class="ket" value="${esc(r.ket || '')}" placeholder="Keterangan" maxlength="100"></div>`;
      }).join('');
    };
    return `<div class="tabs" id="tj">${tabs}</div>
    <div class="card"><div class="card-head"><h4>Absensi ${JENIS[S.jenis].label.replace(/^\S+\s/, '')}</h4><input type="date" id="tgl" value="${S.tgl}"></div>
      ${list.length ? `<button class="btn-light" id="semua">Hadir semua</button>${grup('L')}${grup('P')}<button class="btn block" id="simpanAbs">Simpan Absensi</button>` : '<p class="muted">Tidak ada siswa untuk jenis absensi ini.</p>'}</div>`;
  }

  function pRekap() {
    const T = { sekolah: ['🏫 Sekolah', ['sekolah'], null], sholat: ['🕌 Sholat 5 Waktu', ['subuh', 'dzuhur', 'ashar', 'maghrib', 'isya'], ['islam']], ibadah: ['✝️ Ibadah', ['ibadah_subuh', 'ibadah_siang', 'ibadah_malam'], ['kristen', 'katolik']] };
    const [, kunci, ag] = T[S.tampil], list = db.siswa.filter(s => !ag || ag.includes(s.agama));
    const huruf = s => s ? s.status.charAt(0).toUpperCase() : '-';
    const rows = list.map((s, i) => `<tr><td>${i + 1}</td><td>${esc(s.nama)}</td>${kunci.map(k => { const r = (db.absensi[k + '|' + S.tgl] || {})[s.id]; return `<td><span class="sh ${r ? r.status : ''}">${huruf(r)}</span></td>`; }).join('')}</tr>`).join('');
    return `<div class="tabs" id="tt">${Object.entries(T).map(([k, v]) => `<a class="tab ${k === S.tampil ? 'on' : ''}" data-t="${k}">${v[0]}</a>`).join('')}</div>
    <div class="card"><div class="card-head"><h4>📊 Rekap ${T[S.tampil][0]}</h4><input type="date" id="tgl" value="${S.tgl}"></div>
      <div class="table-scroll"><table class="tbl"><thead><tr><th>#</th><th>Nama</th>${kunci.map(k => `<th>${JENIS[k].label.replace(/^\S+\s/, '').replace('Ibadah ', '')}</th>`).join('')}</tr></thead><tbody>${rows || '<tr><td colspan="9" class="muted">Tidak ada siswa.</td></tr>'}</tbody></table></div>
      <p class="muted" style="margin-top:10px">H = Hadir, S = Sakit, I = Izin, A = Alpa, - = belum diabsen.</p></div>`;
  }

  function pKebersihan() {
    const data = db.kebersihan[S.tgl] || {}, list = db.kamar.filter(k => k.jk === S.kb);
    const tab = g => `<a class="tab ${g === S.kb ? 'on' : ''}" data-k="${g}">${g === 'L' ? '👦 Putra' : '👧 Putri'} (${db.kamar.filter(k => k.jk === g).length})</a>`;
    const ringkas = db.kamar.filter(k => data[k.id]).length;
    return `<div class="tabs" id="tk">${tab('L')}${tab('P')}</div>
    <div class="card"><div class="card-head"><h4>🧹 Penilaian Kebersihan Kamar</h4><input type="date" id="tgl" value="${S.tgl}"></div>
      <div class="chips"><span class="pc">Sudah dinilai ${ringkas} dari ${db.kamar.length} kamar</span></div>
      ${list.map((k, i) => { const r = data[k.id] || {}, cur = r.status || ''; return `<div class="row ${cur === 'kotor' ? 'need' : ''}" data-id="${k.id}">
        <div class="nm"><span class="av">${i + 1}</span><span>${esc(k.nama)}</span></div>
        <div class="opts"><label class="opt bersih"><input type="radio" name="kb${k.id}" value="bersih" ${cur === 'bersih' ? 'checked' : ''}><span>✨ Bersih</span></label>
          <label class="opt kotor"><input type="radio" name="kb${k.id}" value="kotor" ${cur === 'kotor' ? 'checked' : ''}><span>🗑️ Kotor</span></label></div>
        <input class="ket" value="${esc(r.ket || '')}" placeholder="Keterangan (mis. sampah berserakan)" maxlength="100"></div>`; }).join('') || '<p class="muted">Belum ada kamar.</p>'}
      ${list.length ? '<button class="btn block" id="simpanKb">Simpan Penilaian</button>' : ''}</div>
    ${admin() ? `<div class="card"><div class="card-head"><h4>🚪 Atur Kamar</h4></div>
      <form id="fKamar" style="display:flex;gap:8px;flex-wrap:wrap"><input name="n" placeholder="Nama kamar baru" required maxlength="40"><select name="g"><option value="L">Putra</option><option value="P">Putri</option></select><button class="btn">Tambah</button></form>
      <div class="chips" style="margin-top:12px">${db.kamar.map(k => `<span class="pc">${k.jk === 'L' ? '👦' : '👧'} ${esc(k.nama)} <a data-hk="${k.id}" style="color:#e04646;cursor:pointer;margin-left:4px">✕</a></span>`).join('')}</div></div>` : ''}`;
  }

  const PERK = { awal: '🆕 Laporan awal', membaik: '📈 Membaik', tetap: '➖ Tanpa perubahan', memburuk: '📉 Memburuk' };
  function pLaporan() {
    return `<div class="card"><div class="card-head"><h4>📝 Buat Laporan Kebutuhan Khusus</h4></div>
      <p class="muted" style="margin-bottom:12px">Tulis apa yang <b>terlihat dan terjadi</b> (kapan, apa, seberapa sering), bukan dugaan diagnosis.</p>
      <form id="fLap" class="form"><select name="s" required>${db.siswa.map(s => `<option value="${s.id}">${esc(s.nama)}</option>`).join('')}</select>
        <select name="p"><option value="tetap">➖ Tanpa perubahan</option><option value="membaik">📈 Membaik</option><option value="memburuk">📉 Memburuk</option></select>
        <input type="date" name="t" value="${hariIni()}" required>
        <textarea name="x" rows="4" maxlength="500" required placeholder="Contoh: Sering menyendiri saat jam makan malam..."></textarea>
        <button class="btn">Simpan Laporan</button></form></div>
    <div class="card"><div class="card-head"><h4>📋 Daftar Laporan</h4></div>
      ${db.laporan.slice().reverse().map(l => { const s = db.siswa.find(x => x.id === l.siswaId) || { nama: '(dihapus)' }; return `<div class="item"><div class="gr"><b>${esc(s.nama)}</b>
        <small>${tglIndo(l.tgl)} • oleh ${esc(l.pelapor)} • ${PERK[l.perk] || ''}</small><p>${esc(l.teks)}</p></div><button class="btn-del" data-hl="${l.id}">Hapus</button></div>`; }).join('') || '<p class="muted">Belum ada laporan.</p>'}</div>`;
  }

  function pPengumuman() {
    return `<div class="card"><div class="card-head"><h4>📢 Pengumuman</h4></div>
      <form id="fPeng" class="form"><input name="j" placeholder="Judul pengumuman" required maxlength="100"><textarea name="i" rows="3" placeholder="Isi pengumuman"></textarea><button class="btn">Publikasikan</button></form>
      ${db.pengumuman.slice().reverse().map(p => `<div class="item"><div class="gr"><b>${esc(p.judul)}</b><small>${new Date(p.waktu).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' })} • ${esc(p.pembuat)}</small><p>${esc(p.isi).replace(/\n/g, '<br>')}</p></div>
        ${admin() ? `<button class="btn-del" data-hp="${p.id}">Hapus</button>` : ''}</div>`).join('') || '<p class="muted">Belum ada pengumuman.</p>'}</div>`;
  }

  const PAGES = { dashboard: pDashboard, absen: pAbsen, rekap: pRekap, kebersihan: pKebersihan, laporan: pLaporan, pengumuman: pPengumuman };
  function render() {
    if (!PAGES[halaman] || (halaman === 'dashboard' || halaman === 'rekap') && !admin()) halaman = 'absen';
    $('sapa').textContent = 'Halo, ' + (admin() ? 'Admin' : 'Wali Asrama') + ' ✔';
    menu(); $('isi').innerHTML = PAGES[halaman](); document.body.classList.remove('nav');
  }
  const rute = () => { halaman = location.hash.slice(1) || (admin() ? 'dashboard' : 'absen'); render(); };

  // ---------- aksi (event delegation) ----------
  const status = r => { const x = r.querySelector('input:checked'); return x ? x.value : ''; };
  document.addEventListener('click', e => {
    const t = e.target;
    const j = t.closest('[data-j]'); if (j) { S.jenis = j.dataset.j; render(); return; }
    const tt = t.closest('[data-t]'); if (tt) { S.tampil = tt.dataset.t; render(); return; }
    const k = t.closest('[data-k]'); if (k) { S.kb = k.dataset.k; render(); return; }
    if (t.id === 'semua') { document.querySelectorAll('.opt.hadir input').forEach(r => { r.checked = true; }); document.querySelectorAll('.row').forEach(r => r.classList.remove('need')); return; }
    if (t.id === 'simpanAbs') {
      const o = {}; document.querySelectorAll('.row').forEach(r => { const s = status(r); if (s) o[r.dataset.id] = { status: s, ket: s === 'hadir' ? '' : r.querySelector('.ket').value.trim() }; });
      if (!Object.keys(o).length) return toast('Belum ada yang dicentang.');
      db.absensi[S.jenis + '|' + S.tgl] = Object.assign(db.absensi[S.jenis + '|' + S.tgl] || {}, o); simpan(); toast('Absensi tersimpan (' + Object.keys(o).length + ' anak).'); return;
    }
    if (t.id === 'simpanKb') {
      const o = db.kebersihan[S.tgl] = db.kebersihan[S.tgl] || {}; let n = 0;
      document.querySelectorAll('.row').forEach(r => { const s = status(r); if (s) { o[r.dataset.id] = { status: s, ket: s === 'kotor' ? r.querySelector('.ket').value.trim() : '' }; n++; } });
      if (!n) return toast('Belum ada kamar yang dinilai.'); simpan(); toast('Penilaian tersimpan (' + n + ' kamar).'); render(); return;
    }
    const hk = t.closest('[data-hk]'); if (hk && confirm('Hapus kamar ini beserta penilaiannya?')) { const i = Number(hk.dataset.hk); db.kamar = db.kamar.filter(x => x.id !== i); Object.values(db.kebersihan).forEach(d => delete d[i]); simpan(); render(); return; }
    const hl = t.closest('[data-hl]'); if (hl && confirm('Hapus laporan ini?')) { db.laporan = db.laporan.filter(x => x.id !== Number(hl.dataset.hl)); simpan(); render(); return; }
    const hp = t.closest('[data-hp]'); if (hp && confirm('Hapus pengumuman ini?')) { db.pengumuman = db.pengumuman.filter(x => x.id !== Number(hp.dataset.hp)); simpan(); render(); }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'tgl') { if (t.value) { S.tgl = t.value; render(); } return; }
    const row = t.closest('.row'); if (row && t.type === 'radio') {
      const s = status(row), perlu = halaman === 'kebersihan' ? s === 'kotor' : s && s !== 'hadir';
      row.classList.toggle('need', !!perlu);
    }
  });
  document.addEventListener('submit', e => {
    e.preventDefault(); const f = e.target;
    if (f.id === 'fKamar') { db.kamar.push({ id: id(), nama: f.n.value.trim(), jk: f.g.value }); simpan(); render(); toast('Kamar ditambahkan.'); }
    if (f.id === 'fLap') {
      const sid = Number(f.s.value), ada = db.laporan.some(l => l.siswaId === sid);
      db.laporan.push({ id: id(), siswaId: sid, tgl: f.t.value, teks: f.x.value.trim(), perk: ada ? f.p.value : 'awal', pelapor: admin() ? 'Admin' : 'Wali Asrama' });
      simpan(); render(); toast('Laporan tersimpan.');
    }
    if (f.id === 'fPeng') { db.pengumuman.push({ id: id(), judul: f.j.value.trim(), isi: f.i.value.trim(), waktu: new Date().toISOString(), pembuat: admin() ? 'Admin' : 'Wali Asrama' }); simpan(); render(); toast('Pengumuman dipublikasikan.'); }
  });
  $('peran').addEventListener('change', e => { peran = e.target.value; location.hash = admin() ? 'dashboard' : 'absen'; rute(); });
  $('reset').addEventListener('click', () => { if (confirm('Kembalikan semua data ke contoh awal?')) { db = seed(); simpan(); render(); toast('Data demo direset.'); } });
  $('burger').onclick = () => document.body.classList.toggle('nav');
  $('ovl').onclick = () => document.body.classList.remove('nav');
  window.addEventListener('hashchange', rute);
  rute();
})();

</script>
</body>
</html>
